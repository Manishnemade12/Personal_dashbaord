<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
    <title>Portfolio Admin - Mobile & Responsive</title>
    <style id="global-reset">
      *, *::before, *::after {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html, body {
        width: 100%;
        max-width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden !important;
        background-color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body {
        overflow-x: hidden !important;
      }
      #root {
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 100vw;
        height: 100%;
        flex: 1;
        overflow-x: hidden !important;
      }
    </style>
    <link rel="icon" href="/favicon.png" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
